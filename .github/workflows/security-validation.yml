name: Security validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: Analytics metrics tests
        run: npm run test:analytics

      - name: Evidence insight tests
        run: npm run test:evidence

      - name: Training evidence tests
        run: npm run test:training-evidence

      - name: Performance follow-up tests
        run: npm run test:performance-followup

      - name: Training storage tests
        run: npm run test:training-storage

      - name: Training backend isolation tests
        run: npm run test:training-backend

      - name: Training sync tests
        run: npm run test:training-sync

      - name: SQLite repository tests
        run: npm run test:training-sqlite

      - name: SQLite rollout tests
        run: npm run test:sqlite-rollout

      - name: Montage SQLite isolation tests
        run: npm run test:montage-sqlite

      - name: Montage sync tests
        run: npm run test:montage-sync

      - name: Video render plan tests
        run: npm run test:video-render

      - name: Player 360 real analytics tests
        run: npm run test:player360

      - name: OPEN AI conversation context tests
        run: npm run test:open-ai-context

      - name: End-to-end real match flow
        run: npm run test:e2e-real-match

      - name: Match rotation engine tests
        run: npm run test:match-rotation

      - name: Scout rally assist tests
        run: npm run test:scout-rally-assist

      - name: Match set engine tests
        run: npm run test:match-set

      - name: Match substitution engine tests
        run: npm run test:match-substitution

      - name: Production build
        run: npm run build
